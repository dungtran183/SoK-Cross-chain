 Zhang; Li-Cheng Wang; Xiu-Long Liu; Liehuang Zhu\"]\nyear: 2025\nvenue: \"IEEE transactions on computers\"\ndoi: \"10.1109/tc.2025.3590960\"\ntype: method\ndomains: [def-formal-protocol]\nnovelty: complementary\ncitations: 3\n---\n# EC2P: Cost-Effective Cross-Chain Payments via Hubs Resisting the Abort Attack\n\n## One-Line Summary\nCross-chain technology facilitates the interoperability among isolated blockchains, where users can transfer and exchange coins.\n\n## Relevance to KB Topics\n- **def-formal-protocol**\n\n", "zhu2026-scriptless-atomic-swap": "---\ntitle: \"Scriptless Atomic Swap With Batch Processing\"\nauthors: [\"Menghao Wang; Hao-Tian Deng; Meng-Xuan Liu; Meng Li; Chuan Zhang; Li-Cheng Wang; Lie-Huang Zhu\"]\nyear: 2026\nvenue: \"IEEE Transactions on Information Forensics and Security\"\ndoi: \"10.1109/tifs.2026.3707794\"\ntype: method\ndomains: [def-formal-protocol]\nnovelty: complementary\ncitations: 0\n---\n# Scriptless Atomic Swap With Batch Processing\n\n## One-Line Summary\nCross-chain interoperability breaks down information silos between blockchains and enables the interconnection of blockchain systems.\n\n## Relevance to KB Topics\n- **def-formal-protocol**\n\n", "zindros2019-proof-stake-sidechains": "---\ntitle: \"Proof-of-Stake Sidechains\"\nauthors: [\"Peter Gazi; A. Kiayias; Dionysis Zindros\"]\nyear: 2019\nvenue: \"IEEE Symposium on Security and Privacy\"\ndoi: \"10.1109/sp.2019.00040\"\ntype: method\ndomains: [def-lightclient-zk]\nnovelty: complementary\ncitations: 229\n---\n# Proof-of-Stake Sidechains\n\n## One-Line Summary\nSidechains have long been heralded as the key enabler of blockchain scalability and interoperability.\n\n## Relevance to KB Topics\n- **def-lightclient-zk**\n\n"};

const PALETTE = ["#4f9cf9","#7c5cff","#3fb950","#d29922","#f85149","#2dd4bf","#f778ba",
                 "#a371f7","#56d364","#e3b341","#ff7b72","#79c0ff","#d2a8ff","#ffa657"];
const catColor = {};
(KB_CONFIG.categories||[]).forEach((c,i)=>catColor[c.letter]=c.color||PALETTE[i%PALETTE.length]);
const tag2cat = KB_CONFIG.tag_to_category||{};
const tagTitle = KB_CONFIG.tag_titles||{};
const catName = {}; (KB_CONFIG.categories||[]).forEach(c=>catName[c.letter]=c.name);
function novOf(p){const n=p.novelty; return Array.isArray(n)?(n[0]||""):(n||"");}
function catOf(p){const s=new Set();(p.domains||[]).forEach(d=>{if(tag2cat[d])s.add(tag2cat[d]);});return [...s];}
function primaryCat(p){const c=catOf(p);return c[0]||"?";}
function esc(s){return (s||"").replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function escAttr(s){return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function safeUrl(u){u=(u||"").trim();return /^(https?:|mailto:|\.\.?\/)/i.test(u)?u:"#";}

// ---- header ----
document.getElementById('kbName').textContent = KB_CONFIG.name || 'Knowledge Base';
document.getElementById('kbSub').textContent =
  `Interactive knowledge base · ${PAPERS.length} papers · ${(KB_CONFIG.categories||[]).length} categories · generated ${KB_CONFIG.generated||''}`;
const kc=document.getElementById('kwChips');
(KB_CONFIG.keywords||[]).forEach(k=>{const s=document.createElement('span');s.className='chip';s.textContent=k;kc.appendChild(s);});

// ---- nav ----
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));

// ---- stat cards ----
function statCards(){
  const withCode=PAPERS.filter(p=>p.code).length;
  const sota=PAPERS.filter(p=>['sota','foundational'].includes(novOf(p))).length;
  const dl=PAPERS.filter(p=>p.pdf).length;
  const years=PAPERS.map(p=>+p.year).filter(Boolean);
  const cards=[["Papers",PAPERS.length],["SoTA / Foundational",sota],["With Code",withCode],
    ["PDFs",dl],["Topics",Object.keys(tagTitle).length||new Set(PAPERS.flatMap(p=>p.domains||[])).size],
    ["Year range",years.length?Math.min(...years)+"–"+Math.max(...years):"—"]];
  document.getElementById('statCards').innerHTML=cards.map(c=>
    `<div class="stat"><div class="n">${c[1]}</div><div class="l">${c[0]}</div></div>`).join('');
}

// ---- charts ----
const charts=[];
function mkChart(id,cfg){const el=document.getElementById(id);if(!el)return;charts.push(new Chart(el,cfg));}
function countBy(fn){const m={};PAPERS.forEach(p=>{const k=fn(p);(Array.isArray(k)?k:[k]).forEach(x=>{if(x===undefined||x==="")return;m[x]=(m[x]||0)+1;});});return m;}
function gridColor(){return '#2d3742';}
Chart.defaults.color='#8b98a5';Chart.defaults.borderColor='#2d3742';

function buildCharts(){
  const yr=countBy(p=>p.year); const yk=Object.keys(yr).sort();
  mkChart('yearChart',{type:'line',data:{labels:yk,datasets:[{data:yk.map(k=>yr[k]),
    borderColor:'#4f9cf9',backgroundColor:'rgba(79,156,249,.15)',fill:true,tension:.3}]},
    options:{plugins:{legend:{display:false}}}});
  const cat=countBy(p=>catOf(p));
  mkChart('catChart',{type:'doughnut',data:{labels:Object.keys(cat).map(l=>catName[l]||l),
    datasets:[{data:Object.values(cat),backgroundColor:Object.keys(cat).map(l=>catColor[l]||'#888')}]},
    options:{plugins:{legend:{position:'right',labels:{boxWidth:12}}}}});
  const ty=countBy(p=>p.type);
  mkChart('typeChart',{type:'doughnut',data:{labels:Object.keys(ty),
    datasets:[{data:Object.values(ty),backgroundColor:PALETTE}]},
    options:{plugins:{legend:{position:'right',labels:{boxWidth:12}}}}});
  const nv=countBy(p=>novOf(p));
  mkChart('novChart',{type:'bar',data:{labels:Object.keys(nv),
    datasets:[{data:Object.values(nv),backgroundColor:'#7c5cff'}]},
    options:{plugins:{legend:{display:false}}}});
  const tp=countBy(p=>p.domains||[]);
  const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,15);
  mkChart('topicChart',{type:'bar',data:{labels:top.map(t=>tagTitle[t[0]]||t[0]),
    datasets:[{data:top.map(t=>t[1]),backgroundColor:'#3fb950'}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}}}});
  const vq=countBy(p=>p._tier||'unknown');
  mkChart('venueChart',{type:'bar',data:{labels:Object.keys(vq),
    datasets:[{data:Object.values(vq),backgroundColor:'#d29922'}]},
    options:{plugins:{legend:{display:false}}}});
}

// ---- knowledge graph ----
let graphRendered=false;
function renderGraph(){
  const svg=d3.select('#graph'); const W=svg.node().clientWidth, H=svg.node().clientHeight;
  svg.selectAll('*').remove();
  const groupBy=document.getElementById('groupBy').value;
  const ft=document.getElementById('filterTopic').value;
  const data=PAPERS.filter(p=>!ft||(p.domains||[]).includes(ft));
  const groupKey=p=>{if(groupBy==='category')return primaryCat(p);if(groupBy==='topic')return (p.domains||[])[0]||'?';
    if(groupBy==='year')return p.year;return novOf(p)||'?';};
  const groups=[...new Set(data.map(groupKey))];
  const gcolor=d3.scaleOrdinal().domain(groups).range(PALETTE);
  const nodes=data.map(p=>({id:p.id,p,g:groupKey(p)}));
  const hub=groups.map(g=>({id:'__'+g,hub:true,g,label:g}));
  const links=nodes.map(n=>({source:'__'+n.g,target:n.id}));
  const all=[...hub,...nodes];
  const g=svg.append('g');
  svg.call(d3.zoom().scaleExtent([.2,4]).on('zoom',e=>g.attr('transform',e.transform)));
  const sim=d3.forceSimulation(all)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.target.hub?80:36).strength(.5))
    .force('charge',d3.forceManyBody().strength(d=>d.hub?-300:-24))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collide',d3.forceCollide(d=>d.hub?26:6));
  const link=g.append('g').attr('stroke','#2d3742').attr('stroke-opacity',.5)
    .selectAll('line').data(links).join('line');
  const node=g.append('g').selectAll('circle').data(all).join('circle')
    .attr('r',d=>d.hub?16:5).attr('fill',d=>gcolor(d.g))
    .attr('stroke',d=>d.hub?'#fff':'#0f1419').attr('stroke-width',d=>d.hub?2:1)
    .style('cursor','pointer')
    .on('click',(e,d)=>{if(!d.hub)openModal(d.id);})
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  node.append('title').text(d=>d.hub?d.label:(d.p.title));
  const label=g.append('g').selectAll('text').data(hub).join('text')
    .text(d=>(groupBy==='category'?(catName[d.g]||d.g):(tagTitle[d.g]||d.g)))
    .attr('font-size',11).attr('fill','#e6edf3').attr('text-anchor','middle').attr('dy',-20);
  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('cx',d=>d.x).attr('cy',d=>d.y);
    label.attr('x',d=>d.x).attr('y',d=>d.y);
  });
  document.getElementById('graphInfo').textContent=`${nodes.length} papers · ${groups.length} groups`;
  document.getElementById('graphLegend').innerHTML=groups.map(g=>
    `<span><span class="dot" style="background:${gcolor(g)}"></span>${esc(groupBy==='category'?(catName[g]||g):(tagTitle[g]||g))}</span>`).join('');
  const sb=document.getElementById('graphSearch');
  sb.oninput=()=>{const q=sb.value.toLowerCase();node.attr('opacity',d=>d.hub?1:(!q||d.p.title.toLowerCase().includes(q)?1:.12));};
  graphRendered=true;
}
['groupBy','filterTopic'].forEach(id=>document.getElementById(id).onchange=renderGraph);
window.addEventListener('resize',()=>{if(graphRendered&&document.getElementById('tab-graph').classList.contains('active'))renderGraph();});

// ---- heatmap ----
function buildHeatmap(){
  const cats=(KB_CONFIG.categories||[]).map(c=>c.letter);
  const m={};cats.forEach(a=>{m[a]={};cats.forEach(b=>m[a][b]=0);});
  PAPERS.forEach(p=>{const cs=catOf(p);cs.forEach(a=>cs.forEach(b=>{m[a][b]++;}));});
  let max=1;cats.forEach(a=>cats.forEach(b=>{if(a!==b)max=Math.max(max,m[a][b]);}));
  let h='<table class="heat"><tr><th></th>'+cats.map(c=>`<th title="${escAttr(catName[c])}">${esc(c)}</th>`).join('')+'</tr>';
  cats.forEach(a=>{h+=`<tr><th title="${escAttr(catName[a])}">${esc(a)}</th>`;
    cats.forEach(b=>{const v=m[a][b];const bg=a===b?'#1a2029':`rgba(79,156,249,${(v/max*0.85).toFixed(2)})`;
      h+=`<td style="background:${bg}">${a===b?'—':(v||'')}</td>`;});h+='</tr>';});
  h+='</table>';document.getElementById('heatmap').innerHTML=h;
}
function buildTopicList(){
  const tp=countBy(p=>p.domains||[]);
  let h='';(KB_CONFIG.categories||[]).forEach(c=>{
    h+=`<div style="margin:10px 0 4px"><strong style="color:${catColor[c.letter]}">${c.letter}. ${esc(c.name)}</strong></div>`;
    (c.topics||[]).forEach(t=>{h+=`<span class="tag">${esc(t.title||t.tag)} (${tp[t.tag]||0})</span> `;});
  });
  document.getElementById('topicList').innerHTML=h;
}

// ---- explorer table ----
let sortK='year',sortDir=-1;
function fillFilters(){
  const sel=(id,vals)=>{const s=document.getElementById(id);vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});};
  sel('fNov',[...new Set(PAPERS.map(novOf).filter(Boolean))]);
  sel('fType',[...new Set(PAPERS.map(p=>p.type).filter(Boolean))]);
  const fc=document.getElementById('fCat');(KB_CONFIG.categories||[]).forEach(c=>{const o=document.createElement('option');o.value=c.letter;o.textContent=c.name;fc.appendChild(o);});
  const ft=document.getElementById('filterTopic');Object.keys(tagTitle).sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=tagTitle[t];ft.appendChild(o);});
}
function buildTable(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const fn=document.getElementById('fNov').value,ftp=document.getElementById('fType').value,
        fc=document.getElementById('fCat').value,fcode=document.getElementById('fCode').value;
  let rows=PAPERS.filter(p=>{
    if(fn&&novOf(p)!==fn)return false;
    if(ftp&&p.type!==ftp)return false;
    if(fc&&!catOf(p).includes(fc))return false;
    if(fcode&&!p.code)return false;
    if(q){const blob=(p.title+' '+(p.authors||[]).join(' ')+' '+(p.venue||'')+' '+(p.domains||[]).join(' ')).toLowerCase();
      if(!blob.includes(q))return false;}
    return true;});
  rows.sort((a,b)=>{let x=a[sortK],y=b[sortK];if(sortK==='novelty'){x=novOf(a);y=novOf(b);}
    x=x||'';y=y||'';return (x<y?-1:x>y?1:0)*sortDir;});
  const tb=document.querySelector('#paperTable tbody');
  tb.innerHTML=rows.map(p=>{
    const nv=novOf(p);const cls=nv==='sota'?'nov-sota':nv==='foundational'?'nov-foundational':'';
    const topics=(p.domains||[]).slice(0,4).map(t=>`<span class="tag">${esc(tagTitle[t]||t)}</span>`).join('');
    return `<tr onclick="openModal('${escAttr(p.id)}')" style="cursor:pointer">
      <td><div class="truncate" title="${escAttr(p.title)}">${esc(p.title)}</div>
          <div class="muted" style="font-size:11px">${esc((p.authors||[]).slice(0,3).join(', '))}</div></td>
      <td>${esc(String(p.year||''))}</td><td><div class="truncate" style="max-width:180px" title="${escAttr(p.venue)}">${esc(p.venue||'')}</div></td>
      <td>${esc(p.type||'')}</td><td class="${cls}">${esc(nv)}</td><td>${topics}</td></tr>`;}).join('');
  document.getElementById('tableInfo').textContent=`${rows.length} / ${PAPERS.length} papers`;
}
document.querySelectorAll('#paperTable th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}buildTable();});
['search','fNov','fType','fCat','fCode'].forEach(id=>document.getElementById(id).addEventListener('input',buildTable));

// ---- modal: render markdown card ----
function mdToHtml(md){
  // strip frontmatter
  md=md.replace(/^---\n[\s\S]*?\n---\n/,'');
  const lines=md.split('\n');let html='',inTable=false,inCode=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  const flush=()=>{if(inTable){html+='</table>';inTable=false;}};
  for(let i=0;i<lines.length;i++){let ln=lines[i];
    if(ln.trim().startsWith('```')){inCode=!inCode;html+=inCode?'<pre><code>':'</code></pre>';continue;}
    if(inCode){html+=esc(ln)+'\n';continue;}
    if(/^\|(.+)\|$/.test(ln.trim())){
      const cells=ln.trim().slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^:?-+:?$/.test(c))){continue;}
      if(!inTable){html+='<table>';inTable=true;}
      const tag=(i+1<lines.length&&/^\|[\s:|-]+\|$/.test(lines[i+1].trim()))?'th':'td';
      html+='<tr>'+cells.map(c=>`<${tag}>${inline(c)}</${tag}>`).join('')+'</tr>';continue;}
    flush();
    if(/^### /.test(ln))html+='<h3>'+inline(ln.slice(4))+'</h3>';
    else if(/^## /.test(ln))html+='<h2>'+inline(ln.slice(3))+'</h2>';
    else if(/^# /.test(ln))html+='<h1>'+inline(ln.slice(2))+'</h1>';
    else if(/^\d+\. /.test(ln))html+='<div>'+inline(ln)+'</div>';
    else if(/^- /.test(ln))html+='<li>'+inline(ln.slice(2))+'</li>';
    else if(ln.trim())html+='<p>'+inline(ln)+'</p>';
  }
  flush();return html;
}
function openModal(id){
  const p=PAPERS.find(x=>x.id===id);const md=PAPER_CARDS[id];
  const links=[];
  const L=(u,t)=>`<a target="_blank" rel="noopener noreferrer" href="${escAttr(safeUrl(u))}">${t}</a>`;
  if(p){if(p.paper_url||p.arxiv)links.push(L(p.paper_url||('https://arxiv.org/abs/'+p.arxiv),'paper'));
    if(p.doi)links.push(L('https://doi.org/'+p.doi,'doi'));
    if(p.code)links.push(L(p.code,'code'));
    if(p.pdf)links.push(L('../'+p.pdf,'pdf'));}
  const meta=p?`${esc((p.authors||[]).join(', '))} · ${p.year||''} · ${esc(p.venue||'')} · ${links.join(' · ')}`:'';
  const body=md?mdToHtml(md):(p?`<h1>${esc(p.title)}</h1><p>${esc(p.tldr||'No card content embedded.')}</p>`:'Not found');
  document.getElementById('modalBody').innerHTML=`<div class="meta">${meta}</div>`+body;
  document.getElementById('modal').classList.add('open');
  if(window.renderMathInElement){try{renderMathInElement(document.getElementById('modalBody'),
    {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});}catch(e){}}
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ---- init ----
statCards();buildCharts();buildHeatmap();buildTopicList();fillFilters();buildTable();
